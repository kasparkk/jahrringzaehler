[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ring_model.bin"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Netlify liefert .webmanifest sonst als octet-stream aus
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
